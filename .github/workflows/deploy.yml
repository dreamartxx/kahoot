name: Test and publish to Hostinger
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: arena-ci-only
          MYSQL_DATABASE: arena_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -parena-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl
          coverage: none
      - run: npm ci
      - run: npm run check:bank
      - run: php -l api/mobile.php && php -l api/credits.php && php -l api/quiz-formats.php && php -l api/solo.php && php -l api/auth.php && php -l api/core.php && php -l api/family.php && php -l api/tournament.php && php -l api/index.php && php -l api/setup.php
      - run: npm run build
      - run: npm test
        env:
          ARENA_MYSQL_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=arena_test;charset=utf8mb4
          ARENA_MYSQL_TEST_USER: root
          ARENA_MYSQL_TEST_PASSWORD: arena-ci-only
      - name: Publish verified production files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/publish.sh
